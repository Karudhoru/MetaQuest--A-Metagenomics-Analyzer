name: metaquest

channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.11
  - pip

  # External bioinformatics tools used by the maintained runtime
  - kraken2>=2.1.3
  - bracken>=3.1
  - megahit>=1.2.9
  - diamond>=2.0.11,<2.1
  - eggnog-mapper=2.1.15
  - bbmap>=39

  # Python runtime
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - statsmodels>=0.14
  - biopython>=1.81
  - pyrodigal>=3.7.1,<4
  - matplotlib-base>=3.7
  - seaborn>=0.12
  - plotly>=5.14
  - pyyaml>=6.0
  - jinja2>=3.1
  - tqdm>=4.65
  - joblib>=1.3

  # Verification used by the maintained test suite
  - pytest>=7
